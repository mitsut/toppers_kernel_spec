services:
  website:
    image: node:22-slim
    working_dir: /workspace/website
    volumes:
      - .:/workspace
      - node_modules:/workspace/website/node_modules
    ports:
      - "3000:3000"
    command: sleep infinity

  spec:
    image: asciidoctor/docker-asciidoctor
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - LANG=C.UTF-8

volumes:
  node_modules:
